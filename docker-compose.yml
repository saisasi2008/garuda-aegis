services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garuda_aegis_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/telemetry
    container_name: garuda_aegis_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
